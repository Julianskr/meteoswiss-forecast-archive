
name: Collect MeteoSwiss Forecasts

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: meteoswiss-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas requests

      - name: Collect MeteoSwiss forecasts
        run: python collect_meteoswiss.py

      - name: Commit and push new forecasts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add archive/

          if ! git diff --cached --quiet; then
            git commit -m "Archive new MeteoSwiss forecasts"
            git push
          else
            echo "No new forecasts to commit."
          fi
